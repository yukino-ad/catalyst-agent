services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      # The full package still keeps remote operations controlled by .env.
      CLUSTER_SSH_KEY_PATH: /run/secrets/cluster_key
      CLUSTER_SSH_KNOWN_HOSTS: /run/secrets/known_hosts
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CATALYST_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
