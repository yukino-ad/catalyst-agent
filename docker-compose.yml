services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      WEB_REMOTE_OPERATIONS_ENABLED: "false"
      CLUSTER_PREFLIGHT_ENABLED: "false"
      CLUSTER_REMOTE_WRITE_ENABLED: "false"
      CLUSTER_SUBMISSION_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data/checkpoints:/app/data/checkpoints
      - ./data/workflow_runs:/app/data/workflow_runs
      - ./data/reports:/app/data/reports
      - ./data/cluster_jobs:/app/data/cluster_jobs
      - ./data/cluster_results:/app/data/cluster_results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CATALYST_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
